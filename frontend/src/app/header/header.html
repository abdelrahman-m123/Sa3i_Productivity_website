<header class="site-header">
  <div class="container header-row">
    <div class="brand">
      <a class="brand-name">Sa3i Productivity</a>
    </div>

    <!-- Navigation Links -->
    <!-- <nav>
      @for (link of links; track link) {
        <a
          [routerLink]="link.path"
          routerLinkActive="active"
        >
          {{ link.label }}
        </a>
      }
    </nav> -->

    <!-- Profile Section -->
    <div class="profile">
      @if (isLoggedIn()) {
        @if (isDemo()) {
          <span class="demo-badge">Demo mode</span>
        }
        <a [routerLink]="profile" aria-label="Profile">
          @if (profilePhotoUrl(); as photoUrl) {
            <img
              [src]="photoUrl"
              [alt]="name() || 'Profile'"
              class="profile-photo"
              (error)="onProfilePhotoError()"
            />
          } @else {
            <span class="profile-photo profile-placeholder">
              <mat-icon aria-hidden="true">person</mat-icon>
            </span>
          }
        </a>
      } @else {
        <button mat-flat-button [routerLink]="login">Login</button>
        <button mat-button [routerLink]="signUp">Sign up</button>
      }
    </div>
    
  </div>
</header>
