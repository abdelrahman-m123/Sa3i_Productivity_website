<header class="site-header">
  <div class="container header-row">
    <div class="brand">
      <a class="brand-name">Sa3i Productivity</a>
    </div>

    <!-- Angular Material Tab Nav Bar -->
    <nav mat-tab-nav-bar>
      @for (link of links; track link) {
        <a
          mat-tab-link
          [routerLink]="link.path"
          routerLinkActive
          #rla="routerLinkActive"
          [active]="rla.isActive"
        >
          {{ link.label }}
        </a>
      }
    </nav>
  </div>
</header>
