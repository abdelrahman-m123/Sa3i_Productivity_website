name: Deploy backend to Cloudflare Containers

on:
  push:
    branches:
      - master
    paths:
      - backend/**
      - .github/workflows/cloudflare-backend.yml
  pull_request:
    branches:
      - master
    paths:
      - backend/**
      - .github/workflows/cloudflare-backend.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Test
        run: npm test
        working-directory: backend

      - name: Build backend container image
        run: docker build -t sa3i-productivity-api:test .
        working-directory: backend

  deploy:
    name: Deploy backend
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MONGO_URI: ${{ secrets.MONGO_URI }}
      DB_NAME: ${{ secrets.DB_NAME }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Prepare Worker secrets file
        run: |
          node -e "const fs = require('fs'); const required = ['MONGO_URI', 'DB_NAME', 'JWT_SECRET', 'GEMINI_API_KEY']; const missing = required.filter((key) => !process.env[key]); if (missing.length) { console.error('Missing required GitHub Secrets: ' + missing.join(', ')); process.exit(1); } fs.writeFileSync('.deploy.secrets.json', JSON.stringify({ MONGO_URI: process.env.MONGO_URI, db_Name: process.env.DB_NAME, JWT_SECRET: process.env.JWT_SECRET, GEMINI_API_KEY: process.env.GEMINI_API_KEY }, null, 2));"
        working-directory: backend

      - name: Deploy Worker and container
        run: npx wrangler deploy --secrets-file .deploy.secrets.json
        working-directory: backend

      - name: Remove deployment secrets file
        if: always()
        run: rm -f .deploy.secrets.json
        working-directory: backend

      - name: Verify health endpoint
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error https://sa3i-productivity-api.${{ secrets.CLOUDFLARE_WORKERS_SUBDOMAIN }}.workers.dev/health; then
              exit 0
            fi

            sleep 10
          done

          echo "Backend health check did not pass after waiting for container provisioning."
          exit 1
